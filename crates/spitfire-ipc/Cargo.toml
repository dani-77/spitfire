[package]
name = "spitfire-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "spitfire's control socket (like `niri msg`/`hyprctl`) + the spitfirectl binary."

[[bin]]
name = "spitfirectl"
path = "src/bin/spitfirectl.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
