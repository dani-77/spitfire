# xdg-desktop-portal backend preference for the spitfire session.
#
# Installed as /etc/xdg-desktop-portal/spitfire-portals.conf. Picked up
# because packaging/spitfire-session exports XDG_CURRENT_DESKTOP=spitfire,
# and xdg-desktop-portal looks for a $XDG_CURRENT_DESKTOP-portals.conf
# before falling back to the generic portals.conf (default=*, ambiguous
# backend selection).
#
# gtk covers FileChooser/Settings/Notification/Print generically, without
# needing a full desktop environment behind it — the right fit for a
# from-scratch compositor like spitfire. gnome-keyring already runs here
# for Secret, so route that explicitly instead of leaving it to chance.
#
# Not covered: ScreenCast/Screenshot (xdg-desktop-portal-wlr) — spitfire
# doesn't implement wlr-screencopy or ext-image-copy-capture-v1 yet, so
# there's no compositor-side support for either portal to call into.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
