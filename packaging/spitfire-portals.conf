# xdg-desktop-portal backend preference for the spitfire session.
#
# Installed as /etc/xdg-desktop-portal/spitfire-portals.conf. Picked up
# because packaging/spitfire-session exports XDG_CURRENT_DESKTOP=spitfire,
# and xdg-desktop-portal looks for a $XDG_CURRENT_DESKTOP-portals.conf
# before falling back to the generic portals.conf (default=*, ambiguous
# backend selection).
#
# gtk covers FileChooser/Settings/Notification/Print generically, without
# needing a full desktop environment behind it — the right fit for a
# from-scratch compositor like spitfire. gnome-keyring already runs here
# for Secret, so route that explicitly instead of leaving it to chance.
#
# ScreenCast/Screenshot route to wlr — spitfire implements both
# wlr-screencopy-unstable-v1 (crates/spitfire/src/screencopy.rs) and,
# since 2026-08-16, ext-image-copy-capture-v1 too
# (crates/spitfire/src/ext_screencopy.rs) — the protocol
# xdg-desktop-portal-gnome/-kde would actually want, and the one this
# install's own xdg-desktop-portal-wlr already prefers automatically once
# both are advertised. Still routed to wlr rather than gnome/kde here: wlr
# is the one verified end-to-end against a real udev/DRM session with real
# grim captures (see doc/README.md); routing through gnome/kde specifically
# for this protocol has never been tried against spitfire.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
